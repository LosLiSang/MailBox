[package]
name = "mailbox"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mailbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imap = "2"
native-tls = "0.2.18"
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
thiserror = "2.0.21"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
percent-encoding = "2"
ureq = { version = "3", features = ["socks-proxy", "native-tls", "json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
socks = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
